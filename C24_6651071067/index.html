<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xuất thứ trong tuần</title>
</head>
<body>
    <form method="post">
        <table border="3" bordercolor="darkblue" style="border-collapse: collapse; background-color: #ffcccc;">
            <tr>
                <td style="padding: 5px;">
                    <label for="day">Ngày </label>
                    <input type="number" id="day" min="1" value="12" style="width: 50px;" oninput="checkDay()">
                </td>
                
                <td style="padding: 5px;">
                    <label for="month">Tháng Select: </label>
                    <select name="month" id="month" onchange="updateMaxDay()">
                        <option value="1" selected>1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                        <option value="6">6</option>
                        <option value="7">7</option>
                        <option value="8">8</option>
                        <option value="9">9</option>
                        <option value="10">10</option>
                        <option value="11">11</option>
                        <option value="12">12</option>
                    </select>
                </td>
                
                <td style="padding: 5px;">
                    <label for="year">năm </label>
                    <input type="number" id="year" value="2015" oninput="updateMaxDay()" style="width: 60px;">
                </td>
            </tr>

            <tr>
                <td colspan="3" align="center" style="padding: 5px;">
                    <button type="button" onclick="xuatThu()" style="border-radius: 10px; padding: 2px 10px;">Xuất thứ</button>
                </td>
            </tr>
            
            <tr>
                <td colspan="3" align="center" id="res" style="padding: 5px; font-size: 18px; color: black;"></td>
            </tr>
        </table>
    </form>
    <script src="main.js"></script>
    <script>updateMaxDay();</script>
</body>
</html>
