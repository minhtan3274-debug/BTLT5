<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width", intial-scale="1.0">
    <title>Bang tinh luong</title>
</head>

<body>
    <form method="post">
        <table border="3" style="border-collapse: collapse; background-color: orange;">
            <tr>
                <td>
                    <label for="salary">Lương</label>
                </td>

                <td>
                    <input type="number" id="salary">
                </td>
            </tr>

            <tr>
                <td>
                    <label for="he_so_luong">Hệ số lương</label>
                </td>

                <td>
                    <input type="number" id="he_so_luong">
                </td>
            </tr>

            <tr>
                <td colspan="2" align="center">
                    <button type="button" onclick="tinhLuong()" style="border-radius: 20px">Tính lương tháng</button>
                </td>
            </tr>

            <tr>
                <td>Lương tháng: </td>
                <td id="res"></td>
            </tr>
        </table>
    </form>
    <script src="main.js"></script>
</body>
</html>
