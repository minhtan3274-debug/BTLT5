<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xóa dòng trong bảng</title>
</head>
<body>
    <table border="1" style="border-collapse: collapse; border-color: #ccc; font-family: Arial, sans-serif;">
        <tr style="background-color: #ccffcc; font-size: 18px;">
            <th style="padding: 8px 15px;">Số lượng</th>
            <th style="padding: 8px 15px;">Đơn giá</th>
            <th style="padding: 8px 15px;">Tổng</th>
            <th style="padding: 8px 15px;">Chức năng</th>
        </tr>
        
        <tr>
            <td style="padding: 5px;"><input type="number" value="2" oninput="tinhTong(this)" style="width: 120px; padding: 4px;"></td>
            <td style="padding: 5px;"><input type="number" value="1000000" oninput="tinhTong(this)" style="width: 150px; padding: 4px;"></td>
            <td style="padding: 5px;"><input type="number" value="2000000" readonly style="width: 150px; padding: 4px; background-color: #f9f9f9;"></td>
            <td align="center" style="padding: 5px; background-color: #ccffcc;">
                <button type="button" onclick="xoaDong(this)" style="border-radius: 10px; padding: 2px 15px;">Xóa</button>
            </td>
        </tr>

        <tr>
            <td style="padding: 5px;"><input type="number" value="1" oninput="tinhTong(this)" style="width: 120px; padding: 4px;"></td>
            <td style="padding: 5px;"><input type="number" value="500000" oninput="tinhTong(this)" style="width: 150px; padding: 4px;"></td>
            <td style="padding: 5px;"><input type="number" value="500000" readonly style="width: 150px; padding: 4px; background-color: #f9f9f9;"></td>
            <td align="center" style="padding: 5px; background-color: #ccffcc;">
                <button type="button" onclick="xoaDong(this)" style="border-radius: 10px; padding: 2px 15px;">Xóa</button>
            </td>
        </tr>
    </table>
    <script src="main.js"></script>
</body>
</html>
