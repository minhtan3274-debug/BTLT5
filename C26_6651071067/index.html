<!DOCTYPE html>

<body>
    <form>

                </td>
            </tr>
            
            <tr style="background-color: #ccffff;">

                <td></td> <!-- Ô trống ở giữa -->

            </tr>
            
            <tr style="background-color: white;">
                <td style="padding: 10px;">
                    <input type="number" id="nam" value="2015" style="width: 150px; padding: 3px;">
                </td>
                <td align="center" style="padding: 10px;">

                </td>
                <td style="padding: 10px;">
                    <input type="text" id="kq" style="width: 150px; padding: 3px;" readonly>
                </td>

        </table>

    <script src="main.js"></script>
